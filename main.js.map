export default "<ion-toolbar>\n    <ion-title class=\"ion-text-center\"> Symptoms Info</ion-title>\n    <ion-buttons slot=\"primary\">\n        <ion-button color=\"secondary\" (click)=\"dismiss()\">\n            <ion-icon slot=\"icon-only\" ios=\"close\" md=\"close\"></ion-icon>\n        </ion-button>\n    </ion-buttons>\n</ion-toolbar>\n<ion-content>\n\n\n    <section>\n        <ion-list lines=\"full\">\n     \n            <h1 style=\"margin:0 auto\" class=\"ion-text-center\">Top Treatment for {{section}}</h1>\n            <ion-item>\n               \n                <p>\n                        This page displays the % of respondents who reported that the treatment improved this symptom\n                      </p>\n            </ion-item>\n\n  \n        </ion-list>\n      \n\n    </section>\n\n</ion-content>";
