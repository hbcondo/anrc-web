export default "<ion-app >\r\n  <ion-split-pane contentId=\"main-content\">\r\n    <ion-menu contentId=\"main-content\">\r\n      <ion-content>\r\n  \r\n        <ion-list lines=\"none\">\r\n          <ion-list-header> ANRC Home </ion-list-header>\r\n          <ion-menu-toggle\r\n            autoHide=\"false\"\r\n            *ngFor=\"let p of appPages; let i = index\"\r\n          >\r\n            <ion-item\r\n              [routerLink]=\"p.url\"\r\n              routerLinkActive=\"selected\"\r\n              routerDirection=\"root\"\r\n              detail=\"false\"\r\n            >\r\n              <ion-icon slot=\"start\" [name]=\"p.icon + '-outline'\"></ion-icon>\r\n              <ion-label>\r\n                {{ p.title }}\r\n              </ion-label>\r\n            </ion-item>\r\n          </ion-menu-toggle>\r\n        </ion-list>\r\n      </ion-content>\r\n    </ion-menu>\r\n\r\n    <ion-router-outlet id=\"main-content\"></ion-router-outlet>\r\n  </ion-split-pane>\r\n</ion-app>\r\n";
