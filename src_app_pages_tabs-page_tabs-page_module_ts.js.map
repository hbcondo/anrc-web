export default "<ion-button class=\"rating-icon\" fill=\"clear\" shape=\"round\" *ngFor=\"let r of range; let i = index\" (click)=\"rate(i + 1)\">\n        <ion-icon slot=\"icon-only\"\n            [name]=\"value === undefined ?\n            iconOutline :\n            (value > i ? (value < i+1 ? iconHalf : iconFull) : iconOutline)\">\n        </ion-icon>\n    </ion-button>\n";
